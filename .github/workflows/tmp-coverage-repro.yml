# TEMPORARY dry run of the main-branch Coverage Report job for this fix
# branch: same tarpaulin invocation as .github/workflows/test_coverage.yml's
# coverage job (default ptrace engine, full workspace). Removed before merge.
name: tmp-coverage-repro

on:
  push:
    branches: [fix/coverage-timing-tests]

permissions:
  contents: read

concurrency:
  group: tmp-coverage-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-dry-run:
    name: Coverage Report dry run (default engine, full workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Generate coverage report
        run: |
          cargo tarpaulin \
            --workspace \
            --all-features \
            --out Xml Json \
            --output-dir ./coverage \
            --timeout 300 \
            --fail-under 45 \
            --verbose

      - name: Show coverage percentage
        run: |
          jq -r '
            [.files[]] |
            (map(.covered) | add) as $c |
            (map(.coverable) | add) as $t |
            "COVERAGE=\($c / $t * 100)%"
          ' ./coverage/tarpaulin-report.json
